plugins {
	id "com.android.library" version "8.13.2"
}

android {
	namespace "com.deskcansaw.lazernfc"
	compileSdk 36
	buildToolsVersion "36.1.0"

	defaultConfig {
		minSdk 24
		targetSdk 36
		consumerProguardFiles "consumer-rules.pro"
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	buildTypes {
		release {
			minifyEnabled false
		}
	}
}

dependencies {
	// Godot's export template already supplies the engine; never bundle a second copy.
	compileOnly "org.godotengine:godot:4.7.2.stable"
}

tasks.register("stageRelease", Copy) {
	dependsOn "assembleRelease"
	from layout.buildDirectory.file("outputs/aar/lazer-nfc-release.aar")
	into layout.projectDirectory.dir("bin")
}

tasks.named("clean") {
	delete layout.projectDirectory.file("bin/lazer-nfc-release.aar")
}
